<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonys-Jukebox - Live Radio-Statistik</title>
  <style>
    :root {
      --bg: #0f1322;
      --card: #161b2e;
      --border: rgba(255, 123, 0, 0.35);
      --orange: #ff7b00;
      --orange-light: #ffb703;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1b233d 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 50px;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    header {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; color: var(--orange); }
    .brand p { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .stats-bar { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 16px;
      min-width: 110px;
      text-align: center;
    }
    .stat-val { font-size: 22px; font-weight: 800; }
    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-top: 2px; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: var(--card);
      border: 1.5px solid rgba(255,255,255,0.14);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover { border-color: var(--orange); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--orange-light), var(--orange));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 123, 0, 0.35);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }
    input[type="text"], select {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"] { flex: 1; min-width: 220px; }
    input[type="text"]:focus, select:focus { border-color: var(--orange); }
    button.btn {
      background: rgba(255, 123, 0, 0.18);
      border: 1.5px solid var(--orange);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn:hover { background: var(--orange); }
    .status-line {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 5px solid #475569;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card.online { border-left-color: var(--green); }
    .card.offline { border-left-color: var(--red); opacity: 0.78; }
    .card.pinned {
      border: 1.5px solid var(--orange);
      border-left: 6px solid var(--orange);
      box-shadow: 0 0 18px rgba(255, 123, 0, 0.25);
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .radio-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; }
    .badge.on { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge.off { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge.load { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .song { font-size: 13px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Harmonys-Jukebox – Live Radio-Statistik</h1>
        <p id="active-subtitle">Ansicht: Harmony – Montag</p>
      </div>
      <div class="stats-bar">
        <div class="stat-box">
          <div id="sum-listeners" class="stat-val" style="color: var(--orange);">0</div>
          <div class="stat-lbl">Hörer Gesamt</div>
        </div>
        <div class="stat-box">
          <div id="sum-online" class="stat-val" style="color: var(--green);">0</div>
          <div class="stat-lbl">Online</div>
        </div>
        <div class="stat-box">
          <div id="sum-offline" class="stat-val" style="color: var(--red);">0</div>
          <div class="stat-lbl">Offline</div>
        </div>
        <div class="stat-box">
          <div id="sum-total" class="stat-val">0</div>
          <div class="stat-lbl">Radios</div>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="setTab('harmony_mo', this)">Harmony – Montag</button>
      <button class="tab-btn" onclick="setTab('harmony_sa', this)">Harmony – Samstag</button>
      <button class="tab-btn" onclick="setTab('bernie_di', this)">Bernie – Dienstag</button>
      <button class="tab-btn" onclick="setTab('bernie_do', this)">Bernie – Donnerstag</button>
      <button class="tab-btn" onclick="setTab('all', this)">Alle Radios</button>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Radio oder Songtitel suchen..." oninput="render()" />
      <select id="filter-status" onchange="render()">
        <option value="all">Alle anzeigen</option>
        <option value="online">Nur Online (Grün)</option>
        <option value="offline">Nur Offline (Rot)</option>
      </select>
      <select id="sort-by" onchange="render()">
        <option value="listeners">Sortierung: Meiste Hörer</option>
        <option value="name">Sortierung: Name (A–Z)</option>
      </select>
      <button class="btn" onclick="refreshAll()">↻ Aktualisieren</button>
    </div>

    <div class="status-line">
      <span id="last-update">Lade Live-Daten...</span>
      <span>Automatische Aktualisierung alle 30 Sekunden</span>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <script>
    const RADIOS = [
      { name: "Harmonys-Jukebox", type: "lautfm", url: "https://laut.fm", pinned: true, tags: ["harmony_mo", "harmony_sa", "bernie_di", "bernie_do"] },
      { name: "Radio Schmölln", type: "azuracast", url: "https://streamingcloud.online", tags: ["harmony_mo", "harmony_sa", "bernie_di", "bernie_do"] },
      { name: "GartenHeimRadio", type: "icecast", url: "https://spcast.eu", tags: ["harmony_mo", "harmony_sa", "bernie_di"] },
      { name: "Hitradio-Breitungen", type: "shoutcast", url: "http://genx-stream.de", tags: ["harmony_mo", "bernie_di"] },
      { name: "RadioDD63", type: "shoutcast", url: "https://streamplus.de", tags: ["harmony_mo", "harmony_sa", "bernie_di"] },
      { name: "Radio-Forum", type: "shoutcast", url: "http://178.33.33.176:8110", tags: ["harmony_mo", "harmony_sa", "bernie_do"] },
      { name: "RWWO RADIO", type: "shoutcast", url: "http://92.222.193.229:8204", tags: ["harmony_mo", "harmony_sa"] },
      { name: "Power-of-Dream", type: "shoutcast", url: "http://pofd-hosting.de", tags: ["harmony_mo", "harmony_sa"] },
      { name: "RadioFunAndMore", type: "icecast", url: "https://spcast.eu", tags: ["bernie_di"] },
      { name: "Radio AlterKessel", type: "azuracast", url: "https://jom-hosting.de", tags: ["bernie_di"] },
      { name: "beatsXpress", type: "azuracast", url: "https://nexusradio-hosting.de", tags: ["harmony_mo", "harmony_sa"] },
      { name: "Joker-Radio", type: "shoutcast", url: "http://streamserver24.com", tags: ["harmony_sa", "bernie_di"] },
      { name: "Summer-Beats-Radio", type: "shoutcast", url: "https://mein-radiostream.de", tags: ["harmony_mo"] },
      { name: "Antenne Fehmarn", type: "lautfm", url: "https://laut.fm", tags: ["bernie_di"] },
      { name: "Antenne-Steilshoop", type: "lautfm", url: "https://laut.fm", tags: ["harmony_mo", "harmony_sa"] },
      { name: "Bergers-MusikParadies", type: "lautfm", url: "https://laut.fm", tags: ["harmony_mo", "harmony_sa", "bernie_di", "bernie_do"] },
      { name: "Bergers-SchlagerParadies", type: "lautfm", url: "https://laut.fm", tags: ["harmony_mo", "harmony_sa", "bernie_di", "bernie_do"] },
      { name: "Charlys-Funradio (cfr)", type: "lautfm", url: "https://laut.fm", tags: ["harmony_mo"] }
    ];

    const TAB_LABELS = {
      harmony_mo: "Harmony – Montag",
      harmony_sa: "Harmony – Samstag",
      bernie_di: "Bernie – Dienstag",
      bernie_do: "Bernie – Donnerstag",
      all: "Alle Radios"
    };

    let currentTab = "harmony_mo";
    let radioStates = RADIOS.map(r => ({
      ...r,
      status: "loading",
      listeners: 0,
      song: "Lade Stream-Daten..."
    }));

    function setTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      document.getElementById("active-subtitle").textContent = "Ansicht: " + (TAB_LABELS[tab] || tab);
      render();
    }

    function slugifyLautFm(name) {
      return name
        .toLowerCase()
        .replace(/\(.*?\)/g, "")
        .trim()
        .replace(/[^a-z0-9\-]/g, "");
    }

    async function fetchRadioStatus(radio) {
      try {
        if (radio.type === "lautfm") {
          const slug = slugifyLautFm(radio.name);
          const res = await fetch(`https://laut.fm{slug}`);
          if (!res.ok) throw new Error("laut.fm nicht erreichbar");
          const data = await res.json();
          const songTitle = data.current_song
            ? `${data.current_song.artist?.name || ""} - ${data.current_song.title || ""}`.replace(/^ - | - $/g, "")
            : "Live-Stream aktiv";
          return {
            status: "online",
            listeners: Number(data.listeners) || 0,
            song: songTitle || "Kein Titel verfügbar"
          };
        }

        const proxyUrl = `https://allorigins.win{encodeURIComponent(radio.url)}`;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeout);

        if (!res.ok) throw new Error("Proxy-Fehler");
        const wrapper = await res.json();
        const text = wrapper.contents || "";

        if (text.length > 0) {
          let listeners = 0;
          let song = "Stream online";

          try {
            const json = JSON.parse(text);
            if (Array.isArray(json) && json[0]?.listeners) {
              listeners = Number(json[0].listeners.current) || 0;
              song = json[0].now_playing?.song?.text || song;
            } else if (json.icestats?.source) {
              const src = Array.isArray(json.icestats.source) ? json.icestats.source[0] : json.icestats.source;
              listeners = Number(src.listeners) || 0;
              song = src.title || song;
            } else if (typeof json.currentlisteners !== "undefined") {
              listeners = Number(json.currentlisteners) || 0;
              song = json.songtitle || song;
            }
          } catch (_) {
            const matchListeners = text.match(/Current Stream Information.*?(\d+)\s*of\s*\d+/i) || text.match(/"listeners"\s*:\s*(\d+)/i);
            if (matchListeners) listeners = Number(matchListeners[1]) || 0;
          }

          return { status: "online", listeners, song };
        }

        return { status: "offline", listeners: 0, song: "Offline / Nicht erreichbar" };
      } catch (err) {
        return { status: "offline", listeners: 0, song: "Offline / Keine Antwort" };
      }
    }

    async function refreshAll() {
      const updateEl = document.getElementById("last-update");
      updateEl.textContent = "Aktualisiere Live-Daten...";

      const results = await Promise.all(
        RADIOS.map(async (r) => {
          const info = await fetchRadioStatus(r);
          return { ...r, ...info };
        })
      );

      radioStates = results;
      render();

      const now = new Date();
      updateEl.textContent = "Letztes Update: " + now.toLocaleTimeString("de-DE");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      const search = document.getElementById("search").value.toLowerCase().trim();
      const filterStatus = document.getElementById("filter-status").value;
      const sortBy = document.getElementById("sort-by").value;

      let tabList = radioStates.filter(r => currentTab === "all" || r.tags.includes(currentTab));

      const totalListeners = tabList.reduce((acc, r) => acc + (r.status === "online" ? r.listeners : 0), 0);
      const onlineCount = tabList.filter(r => r.status === "online").length;
      const offlineCount = tabList.filter(r => r.status === "offline").length;

      document.getElementById("sum-listeners").textContent = totalListeners;
      document.getElementById("sum-online").textContent = onlineCount;
      document.getElementById("sum-offline").textContent = offlineCount;
      document.getElementById("sum-total").textContent = tabList.length;

      let visible = tabList.filter(r => {
        if (filterStatus === "online" && r.status !== "online") return false;
        if (filterStatus === "offline" && r.status !== "offline") return false;
        if (search) {
          const hay = (r.name + " " + r.song).toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      });

      visible.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        if (sortBy === "listeners") {
          if (b.listeners !== a.listeners) return b.listeners - a.listeners;
        }
        return a.name.localeCompare(b.name, "de");
      });

      const grid = document.getElementById("grid");
      if (visible.length === 0) {
        grid.innerHTML = `<div class="card"><div class="song">Keine Radios für diese Auswahl gefunden.</div></div>`;
        return;
      }

      grid.innerHTML = visible.map(r => {
        const badgeClass = r.status === "online" ? "on" : (r.status === "offline" ? "off" : "load");
        const badgeText = r.status === "online" ? `ONLINE • ${r.listeners}` : (r.status === "offline" ? "OFFLINE" : "LÄDT...");
        const cardClass = `card ${r.status} ${r.pinned ? "pinned" : ""}`.trim();

        return `
          <div class="${cardClass}">
            <div class="card-top">
              <div class="radio-name" title="${escapeHtml(r.name)}">${r.pinned ? "⭐ " : ""}${escapeHtml(r.name)}</div>
              <span class="badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="song" title="${escapeHtml(r.song)}">🎵 ${escapeHtml(r.song)}</div>
            <div class="meta">
              <span>Server: ${escapeHtml(r.type.toUpperCase())}</span>
              <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener" style="color: var(--orange-light); text-decoration: none;">Stream öffnen ↗</a>
            </div>
          </div>
        `;
      }).join("");
    }

    render();
    refreshAll();
    setInterval(refreshAll, 30000);
  </script>
</body>
</html>
