<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonys-Jukebox - Live Radio-Statistik</title>
  <style>
    :root {
      --bg: #0f1322;
      --card: #161b2e;
      --border: rgba(255, 123, 0, 0.35);
      --orange: #ff7b00;
      --orange-light: #ffb703;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1b233d 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 50px;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    header {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; color: var(--orange); }
    .brand p { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .stats-bar { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 16px;
      min-width: 110px;
      text-align: center;
    }
    .stat-val { font-size: 22px; font-weight: 800; }
    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-top: 2px; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: var(--card);
      border: 1.5px solid rgba(255,255,255,0.14);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover { border-color: var(--orange); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--orange-light), var(--orange));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 123, 0, 0.35);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }
    input[type="text"], select {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"] { flex: 1; min-width: 220px; }
    input[type="text"]:focus, select:focus { border-color: var(--orange); }
    button.btn {
      background: rgba(255, 123, 0, 0.18);
      border: 1.5px solid var(--orange);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn:hover { background: var(--orange); }
    .status-line {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 5px solid #475569;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card.online { border-left-color: var(--green); }
    .card.offline { border-left-color: var(--red); opacity: 0.78; }
    .card.pinned {
      border: 1.5px solid var(--orange);
      border-left: 6px solid var(--orange);
      box-shadow: 0 0 18px rgba(255, 123, 0, 0.25);
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .radio-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; }
    .badge.on { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge.off { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge.load { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .song { font-size: 13px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .stream-link { color: var(--orange-light); text-decoration: none; }
    .stream-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Harmonys-Jukebox – Live Radio-Statistik</h1>
        <p id="active-subtitle">Ansicht: Alle Radios</p>
      </div>
      <div class="stats-bar">
        <div class="stat-box">
          <div id="sum-listeners" class="stat-val" style="color: var(--orange);">0</div>
          <div class="stat-lbl">Hörer Gesamt</div>
        </div>
        <div class="stat-box">
          <div id="sum-online" class="stat-val" style="color: var(--green);">0</div>
          <div class="stat-lbl">Online</div>
        </div>
        <div class="stat-box">
          <div id="sum-offline" class="stat-val" style="color: var(--red);">0</div>
          <div class="stat-lbl">Offline</div>
        </div>
        <div class="stat-box">
          <div id="sum-total" class="stat-val">0</div>
          <div class="stat-lbl">Radios</div>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn" onclick="setTab('harmony_mo', this)">Harmony – Montag</button>
      <button class="tab-btn" onclick="setTab('harmony_sa', this)">Harmony – Samstag</button>
      <button class="tab-btn" onclick="setTab('bernie_di', this)">Bernie – Dienstag</button>
      <button class="tab-btn" onclick="setTab('bernie_do', this)">Bernie – Donnerstag</button>
      <button class="tab-btn active" onclick="setTab('all', this)">Alle Radios</button>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Radio oder Songtitel suchen..." oninput="render()" />
      <select id="filter-status" onchange="render()">
        <option value="all">Alle anzeigen</option>
        <option value="online">Nur Online (Grün)</option>
        <option value="offline">Nur Offline (Rot)</option>
      </select>
      <select id="sort-by" onchange="render()">
        <option value="listeners">Sortierung: Meiste Hörer</option>
        <option value="name">Sortierung: Name (A–Z)</option>
      </select>
      <button class="btn" onclick="refreshAll()">↻ Aktualisieren</button>
    </div>

    <div class="status-line">
      <span id="last-update">Lade Live-Daten...</span>
      <span>Automatische Aktualisierung alle 30 Sekunden</span>
    </div>

    <div id="grid" class="grid"></div>
  </div>

const RADIOS = RAW.map(function(x) {
let fullUrl = x.at(2);
      if (x.at(1) === "lautfm") fullUrl = "https://" + "laut.fm/" + x.at(2);
      if (x.at(1) === "custom") fullUrl = "https://" + "status.harmonys-jukebox.de/custom_api.php?station=" + x.at(2);
return { name: x.at(0), type: x.at(1), target: x.at(2), url: fullUrl, tags: x.at(3), pinned: !!x.at(4) };
});
const TAB_LABELS = {
harmony_mo: "Harmony – Montag",
harmony_sa: "Harmony – Samstag",
bernie_di: "Bernie – Dienstag",
bernie_do: "Bernie – Donnerstag",

};
let currentTab = "all";
let radioStates = RADIOS.map(function(r) {
return Object.assign({}, r, { status: "loading", listeners: 0, song: "Lade Stream-Daten..." });
});
function setTab(tab, btn) {
currentTab = tab;
document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
if (btn) btn.classList.add("active");
document.getElementById("active-subtitle").textContent = "Ansicht: " + (TAB_LABELS[tab] || tab);
render();
}
async function fetchText(url, ms) {
const c = new AbortController();
const t = setTimeout(function() { c.abort(); }, ms || 8000);
try {
const res = await fetch(url, { signal: c.signal });
clearTimeout(t);
return res.ok ? await res.text() : null;
} catch (e) {
clearTimeout(t);
return null;
}
}
async function fetchProxy(targetUrl) {
if (targetUrl.indexOf("https://") === 0) {
const direct = await fetchText(targetUrl, 7000);
if (direct) return direct;
}
const p1 = await fetchText("codetabs.com" + encodeURIComponent(targetUrl), 9000);
if (p1) return p1;
const p2 = await fetchText("allorigins.win" + encodeURIComponent(targetUrl), 9000);
if (p2) {
try {
const j = JSON.parse(p2);
if (j && j.contents) return j.contents;
} catch (e) {}
}
return null;
}
async function fetchRadioStatus(r) {
try {
if (r.type === "lautfm") {
const txt = await fetchText("laut.fm" + r.target, 8000);
if (!txt) throw new Error();
const d = JSON.parse(txt);
let song = "Live-Stream aktiv";
if (d.current_song) {
const a = (d.current_song.artist && d.current_song.artist.name) || "";
const t = d.current_song.title || "";
song = (a + " - " + t).replace(/^ - | - $/g, "") || song;
}
return { status: "online", listeners: Number(d.listeners) || 0, song: song };
}
if (r.type === "azuracast") {
const txt = await fetchProxy(r.url);
if (!txt) throw new Error();
const j = JSON.parse(txt);
const it = Array.isArray(j) ? j.at(0) : j;
return {
status: "online",
listeners: Number(it && it.listeners && it.listeners.current) || 0,
song: (it && it.now_playing && it.now_playing.song && it.now_playing.song.text) || "Live-Stream aktiv"
};
}
if (r.type === "custom") {
const txt = await fetchProxy(r.url);
if (!txt) throw new Error();
const j = JSON.parse(txt);
return {
status: j.online === false ? "offline" : "online",
listeners: Number(j.listeners || j.currentlisteners || j.total_listeners || 0),
song: j.song || j.songtitle || j.title || "Live-Stream aktiv"
};
}
if (r.type === "icecast") {
const txt = await fetchProxy(r.url.replace(//+$/, "") + "/status-json.xsl");
if (!txt) throw new Error();
const j = JSON.parse(txt);
const src = j.icestats && j.icestats.source;
if (!src) throw new Error();
const list = Array.isArray(src) ? src : [src];
const l = list.reduce(function(s, x) { return s + (Number(x.listeners) || 0); }, 0);
const wt = list.find(function(x) { return x.title; });
return { status: "online", listeners: l, song: (wt && wt.title) || "Live-Stream aktiv" };
}
if (r.type === "shoutcast") {
const txt = await fetchProxy(r.url.replace(//+$/, "") + "/stats?json=1");
if (!txt) throw new Error();
const j = JSON.parse(txt);
return {
status: Number(j.streamstatus) === 0 ? "offline" : "online",
listeners: Number(j.currentlisteners || j.uniquelisteners || 0),
song: j.songtitle || "Live-Stream aktiv"
};
}
} catch (e) {}
return { status: "offline", listeners: 0, song: "Offline / Keine Antwort" };
}
async function refreshAll() {
const el = document.getElementById("last-update");
el.textContent = "Aktualisiere Live-Daten...";
const updated = radioStates.slice();
for (let i = 0; i < RADIOS.length; i += 12) {
const batch = RADIOS.slice(i, i + 12);
const res = await Promise.all(batch.map(async function(r) {
const info = await fetchRadioStatus(r);
return Object.assign({}, r, info);
}));
for (let j = 0; j < res.length; j++) updated[i + j] = res[j];
radioStates = updated.slice();
render();
}
el.textContent = "Letztes Update: " + new Date().toLocaleTimeString("de-DE");
}
function makeEl(tag, cls, text) {
const el = document.createElement(tag);
if (cls) el.className = cls;
if (text !== undefined) el.textContent = text;
return el;
}
function render() {
const q = document.getElementById("search").value.toLowerCase().trim();
const st = document.getElementById("filter-status").value;
const sb = document.getElementById("sort-by").value;
const tabList = radioStates.filter(function(r) { return currentTab === "all" || r.tags.indexOf(currentTab) !== -1; });
document.getElementById("sum-listeners").textContent = tabList.reduce(function(a, r) { return a + (r.status === "online" ? r.listeners : 0); }, 0);
document.getElementById("sum-online").textContent = tabList.filter(function(r) { return r.status === "online"; }).length;
document.getElementById("sum-offline").textContent = tabList.filter(function(r) { return r.status === "offline"; }).length;
document.getElementById("sum-total").textContent = tabList.length;
const vis = tabList.filter(function(r) {
if (st === "online" && r.status !== "online") return false;
if (st === "offline" && r.status !== "offline") return false;
if (q && (r.name + " " + r.song).toLowerCase().indexOf(q) === -1) return false;
return true;
});
vis.sort(function(a, b) {
if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
if (sb === "listeners" && b.listeners !== a.listeners) return b.listeners - a.listeners;
return a.name.localeCompare(b.name, "de");
});
const grid = document.getElementById("grid");
grid.innerHTML = "";
if (!vis.length) {
const emptyCard = makeEl("div", "card");
emptyCard.appendChild(makeEl("div", "song", "Keine Radios gefunden."));
grid.appendChild(emptyCard);
return;
}
vis.forEach(function(r) {
const bc = r.status === "online" ? "badge on" : (r.status === "offline" ? "badge off" : "badge load");
const bt = r.status === "online" ? ("ONLINE • " + r.listeners) : (r.status === "offline" ? "OFFLINE" : "LÄDT...");
const cc = ("card " + r.status + (r.pinned ? " pinned" : "")).trim();
const card = makeEl("div", cc);
const top = makeEl("div", "card-top");
const nameEl = makeEl("div", "radio-name", (r.pinned ? "⭐ " : "") + r.name);
nameEl.title = r.name;
const badgeEl = makeEl("span", bc, bt);
top.appendChild(nameEl);
top.appendChild(badgeEl);
const songEl = makeEl("div", "song", "🎵 " + r.song);
songEl.title = r.song;
const meta = makeEl("div", "meta");
const srvEl = makeEl("span", "", "Server: " + r.type.toUpperCase());
const linkEl = makeEl("a", "stream-link", "Stream öffnen ↗");
linkEl.href = r.url;
linkEl.target = "_blank";
linkEl.rel = "noopener";
meta.appendChild(srvEl);
meta.appendChild(linkEl);
card.appendChild(top);
card.appendChild(songEl);
card.appendChild(meta);
grid.appendChild(card);
