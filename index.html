<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonys-Jukebox - Live Radio-Statistik</title>
  <style>
    :root {
      --bg: #0f1322;
      --card: #161b2e;
      --border: rgba(255, 123, 0, 0.35);
      --orange: #ff7b00;
      --orange-light: #ffb703;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1b233d 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 50px;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    header {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; color: var(--orange); }
    .brand p { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .stats-bar { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 16px;
      min-width: 110px;
      text-align: center;
    }
    .stat-val { font-size: 22px; font-weight: 800; }
    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-top: 2px; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: var(--card);
      border: 1.5px solid rgba(255,255,255,0.14);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover { border-color: var(--orange); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--orange-light), var(--orange));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 123, 0, 0.35);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }
    input[type="text"], select {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"] { flex: 1; min-width: 220px; }
    input[type="text"]:focus, select:focus { border-color: var(--orange); }
    button.btn {
      background: rgba(255, 123, 0, 0.18);
      border: 1.5px solid var(--orange);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn:hover { background: var(--orange); }
    .status-line {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 5px solid #475569;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card.online { border-left-color: var(--green); }
    .card.offline { border-left-color: var(--red); opacity: 0.78; }
    .card.pinned {
      border: 1.5px solid var(--orange);
      border-left: 6px solid var(--orange);
      box-shadow: 0 0 18px rgba(255, 123, 0, 0.25);
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .radio-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; }
    .badge.on { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge.off { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge.load { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .song { font-size: 13px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
  </style>
</head>

async function fetchText(url, timeoutMs = 8000) {
const controller = new AbortController();
const timer = setTimeout(() => controller.abort(), timeoutMs);
try {
const res = await fetch(url, { signal: controller.signal });
clearTimeout(timer);
if (!res.ok) return null;
return await res.text();
} catch (_) {
clearTimeout(timer);
return null;
}
}
async function fetchWithFallback(targetUrl) {
if (targetUrl.startsWith("https://")) {
const direct = await fetchText(targetUrl, 7000);
if (direct) return direct;
}
const proxy1 = await fetchText(https://codetabs.com{encodeURIComponent(targetUrl)}, 9000);
if (proxy1) return proxy1;
const proxy2Raw = await fetchText(https://allorigins.win{encodeURIComponent(targetUrl)}, 9000);
if (proxy2Raw) {
try {
const parsed = JSON.parse(proxy2Raw);
if (parsed && parsed.contents) return parsed.contents;
} catch (_) {}
}
return null;
}
async function fetchRadioStatus(radio) {
try {
if (radio.type === "lautfm") {
const slug = radio.url.replace(//+$/, "").split("/").pop();
const text = await fetchText(https://laut.fm{slug}, 8000);
if (!text) throw new Error("laut.fm Fehler");
const data = JSON.parse(text);
const songTitle = data.current_song
? ${data.current_song.artist?.name || ""} - ${data.current_song.title || ""}.replace(/^ - | - $/g, "")
: "Live-Stream aktiv";
return {
status: "online",
listeners: Number(data.listeners) || 0,
song: songTitle || "Live-Stream aktiv"
};
}
if (radio.type === "azuracast") {
const text = await fetchWithFallback(radio.url);
if (!text) throw new Error("Keine Antwort");
const json = JSON.parse(text);
const item = Array.isArray(json) ? json[0] : json;
return {
status: "online",
listeners: Number(item?.listeners?.current) || 0,
song: item?.now_playing?.song?.text || "Live-Stream aktiv"
};
}
if (radio.type === "custom") {
const text = await fetchWithFallback(radio.url);
if (!text) throw new Error("Keine Antwort");
const json = JSON.parse(text);
const listeners = Number(json.listeners ?? json.currentlisteners ?? json.total_listeners ?? 0);
const song = json.song || json.songtitle || json.title || "Live-Stream aktiv";
return {
status: json.online === false ? "offline" : "online",
listeners,
song
};
}
if (radio.type === "icecast") {
const baseUrl = radio.url.replace(//+$/, "");
const text = await fetchWithFallback(${baseUrl}/status-json.xsl);
if (!text) throw new Error("Keine Antwort");
const json = JSON.parse(text);
const sources = json.icestats?.source;
if (!sources) throw new Error("Keine Quelle");
const list = Array.isArray(sources) ? sources : [sources];
const listeners = list.reduce((sum, s) => sum + (Number(s.listeners) || 0), 0);
const song = list.find(s => s.title)?.title || "Live-Stream aktiv";
return { status: "online", listeners, song };
}
if (radio.type === "shoutcast") {
const baseUrl = radio.url.replace(//+$/, "");
const text = await fetchWithFallback(${baseUrl}/stats?json=1);
if (!text) throw new Error("Keine Antwort");
const json = JSON.parse(text);
const listeners = Number(json.currentlisteners ?? json.uniquelisteners ?? 0);
const song = json.songtitle || "Live-Stream aktiv";
return {
status: Number(json.streamstatus) === 0 ? "offline" : "online",
listeners,
song
};
}
return { status: "offline", listeners: 0, song: "Offline / Nicht erreichbar" };
} catch (_) {
return { status: "offline", listeners: 0, song: "Offline / Keine Antwort" };
}
}
async function refreshAll() {
const updateEl = document.getElementById("last-update");
updateEl.textContent = "Aktualisiere Live-Daten...";
const batchSize = 12;
const updated = [...radioStates];
for (let i = 0; i < RADIOS.length; i += batchSize) {
const batch = RADIOS.slice(i, i + batchSize);
const results = await Promise.all(
batch.map(async (r) => {
const info = await fetchRadioStatus(r);
return { ...r, ...info };
})
);
for (let j = 0; j < results.length; j++) {
updated[i + j] = results[j];
}
radioStates = [...updated];
render();
}
const now = new Date();
updateEl.textContent = "Letztes Update: " + now.toLocaleTimeString("de-DE");
}
function escapeHtml(str) {
return String(str || "")
.replace(/&/g, "&")
.replace(/</g, "<")
.replace(/>/g, ">")
.replace(/"/g, """);
}

const offlineCount = tabList.filter(r => r.status === "offline").length;
document.getElementById("sum-listeners").textContent = totalListeners;

document.getElementById("sum-total").textContent = tabList.length;
let visible = tabList.filter(r => {
if (filterStatus === "online" && r.status !== "online") return false;
if (filterStatus === "offline" && r.status !== "offline") return false;
if (search) {
const hay = (r.name + " " + r.song).toLowerCase();
if (!hay.includes(search)) return false;
}
return true;
});
visible.sort((a, b) => {
if (a.pinned && !b.pinned) return -1;
if (!a.pinned && b.pinned) return 1;
if (sortBy === "listeners") {
if (b.listeners !== a.listeners) return b.listeners - a.listeners;
}
return a.name.localeCompare(b.name, "de");
});
const grid = document.getElementById("grid");
if (visible.length === 0) {
grid.innerHTML = <div class="card"><div class="song">Keine Radios für diese Auswahl gefunden.</div></div>;
return;
}
grid.innerHTML = visible.map(r => {
const badgeClass = r.status === "online" ? "on" : (r.status === "offline" ? "off" : "load");
const badgeText = r.status === "online" ? ONLINE • ${r.listeners} : (r.status === "offline" ? "OFFLINE" : "LÄDT...");
const cardClass = card ${r.status} ${r.pinned ? "pinned" : ""}.trim();
return <div class="${cardClass}"> <div class="card-top"> <div class="radio-name" title="${escapeHtml(r.name)}">${r.pinned ? "⭐ " : ""}${escapeHtml(r.name)}</div> <span class="badge ${badgeClass}">${badgeText}</span> </div> <div class="song" title="${escapeHtml(r.song)}">🎵 ${escapeHtml(r.song)}</div> <div class="meta"> <span>Server: ${escapeHtml(r.type.toUpperCase())}</span> <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener" style="color: var(--orange-light); text-decoration: none;">Stream öffnen ↗</a> </div> </div>;
}).join("");
}
render();
refreshAll();
setInterval(refreshAll, 30000);
</script>
</body>
</html>
