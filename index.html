<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonys-Jukebox - Live Radio-Statistik</title>
  <style>
    :root {
      --bg: #0f1322;
      --card: #161b2e;
      --border: rgba(255, 123, 0, 0.35);
      --orange: #ff7b00;
      --orange-light: #ffb703;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1b233d 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 50px;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    header {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; color: var(--orange); }
    .brand p { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .stats-bar { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 16px;
      min-width: 110px;
      text-align: center;
    }
    .stat-val { font-size: 22px; font-weight: 800; }
    .stat-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-top: 2px; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: var(--card);
      border: 1.5px solid rgba(255,255,255,0.14);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn:hover { border-color: var(--orange); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--orange-light), var(--orange));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 123, 0, 0.35);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }
    input[type="text"], select {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"] { flex: 1; min-width: 220px; }
    input[type="text"]:focus, select:focus { border-color: var(--orange); }
    button.btn {
      background: rgba(255, 123, 0, 0.18);
      border: 1.5px solid var(--orange);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn:hover { background: var(--orange); }
    .status-line {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 5px solid #475569;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-right: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card.online { border-left-color: var(--green); }
    .card.offline { border-left-color: var(--red); opacity: 0.78; }
    .card.pinned {
      border: 1.5px solid var(--orange);
      border-left: 6px solid var(--orange);
      box-shadow: 0 0 18px rgba(255, 123, 0, 0.25);
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .radio-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; }
    .badge.on { background: rgba(34, 197, 94, 0.18); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge.off { background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge.load { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
    .song { font-size: 13px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Harmonys-Jukebox – Live Radio-Statistik</h1>
        <p id="active-subtitle">Ansicht: Harmony – Montag</p>
      </div>
      <div class="stats-bar">
        <div class="stat-box">
          <div id="sum-listeners" class="stat-val" style="color: var(--orange);">0</div>
          <div class="stat-lbl">Hörer Gesamt</div>
        </div>
        <div class="stat-box">
          <div id="sum-online" class="stat-val" style="color: var(--green);">0</div>
          <div class="stat-lbl">Online</div>
        </div>
        <div class="stat-box">
          <div id="sum-offline" class="stat-val" style="color: var(--red);">0</div>
          <div class="stat-lbl">Offline</div>
        </div>
        <div class="stat-box">
          <div id="sum-total" class="stat-val">0</div>
          <div class="stat-lbl">Radios</div>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="setTab('harmony_mo', this)">Harmony – Montag</button>
      <button class="tab-btn" onclick="setTab('harmony_sa', this)">Harmony – Samstag</button>
      <button class="tab-btn" onclick="setTab('bernie_di', this)">Bernie – Dienstag</button>
      <button class="tab-btn" onclick="setTab('bernie_do', this)">Bernie – Donnerstag</button>
      <button class="tab-btn" onclick="setTab('all', this)">Alle Radios</button>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Radio oder Songtitel suchen..." oninput="render()" />
      <select id="filter-status" onchange="render()">
        <option value="all">Alle anzeigen</option>
        <option value="online">Nur Online (Grün)</option>
        <option value="offline">Nur Offline (Rot)</option>
      </select>
      <select id="sort-by" onchange="render()">
        <option value="listeners">Sortierung: Meiste Hörer</option>
        <option value="name">Sortierung: Name (A–Z)</option>
      </select>
      <button class="btn" onclick="refreshAll()">↻ Aktualisieren</button>
    </div>

    <div class="status-line">
      <span id="last-update">Lade Live-Daten...</span>
      <span>Automatische Aktualisierung alle 30 Sekunden</span>
    </div>

    <div id="grid" class="grid"></div>
  </div>
